<!DOCTYPE html>
<html manifest="505.manifest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 AUTO JAILBREAK - KENNY YOON</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: #0b0e14;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            color: #0088ff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .header p {
            color: #6a7b95;
            font-size: 14px;
            font-weight: 600;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background-color: #121824;
            border: 1px solid #1c2638;
            border-radius: 8px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-label {
            color: #8c9ba5;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 16px;
            font-weight: 700;
            text-align: right;
        }

        .status-msg {
            color: #0088ff;
            word-break: break-word;
        }

        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #4a5a70;
            line-height: 1.6;
        }

        .footer a {
            color: #f31414;
            text-decoration: none;
            margin: 0 4px;
        }
    </style>
</head>

<body>

    <script>
        history.replaceState(null, null, 'index.html'); var histlength = history.length; history.go(-histlength);
        function DLProgress(e) { Percent = (Math.round(e.loaded / e.total * 100)); window.msgs.innerHTML = "Đang cài đặt Cache Offline: " + Percent + "%"; }
        function DisplayCacheProgress() { window.msgs.innerHTML = "Đã cài đặt Cache thành công ✔"; setTimeout(function () { window.msgs.innerHTML = "Hãy đóng và mở lại trình duyệt..."; }, 1500); }
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function (e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
        window.applicationCache.onerror = function (e) { window.msgs.innerHTML = "Lỗi cài đặt Cache! Hãy xóa dữ liệu trình duyệt và thử lại..."; };
    </script>

    <div class="container">
        <div class="header">
            <h1>AUTO JAILBREAK PS4 - KENNY YOON</h1>
            <p>HỖ TRỢ FW 5.05 - 13.52</p>
        </div>

        <div class="card-list">
            <div class="card">
                <div class="card-label">FIRMWARE</div>
                <div class="card-value" id="fw-val">5.05 / 5.07</div>
            </div>

            <div class="card">
                <div class="card-label">TẢI TRỌNG</div>
                <div class="card-value">Cài đặt Cache Offline</div>
            </div>

            <div class="card">
                <div class="card-label">NGÀY CẬP NHẬT</div>
                <div class="card-value">27/09/2026</div>
            </div>

            <div class="card">
                <div class="card-label">TRẠNG THÁI</div>
                <div class="card-value status-msg" id="msgs">Đang bắt đầu cài đặt Cache...</div>
            </div>
        </div>

</body>

</html>
