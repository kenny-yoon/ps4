<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AUTO JAILBREAK PS4 - KENNY YOON</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f293d;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --accent-blue: #0084ff;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: transparent;
      text-align: center;
    }

    .header {
      margin-bottom: 25px;
    }

    .header h1 {
      color: var(--accent-blue);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
    }

    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .info-label {
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .info-value {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      text-align: right;
    }

    .info-value.error {
      color: var(--accent-red);
    }

    .credits {
      margin-top: 25px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .credits a {
      color: var(--accent-red);
      text-decoration: none;
      margin: 0 4px;
      font-weight: 600;
    }

    .credits a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h1>AUTO JAILBREAK PS4 - KENNY YOON</h1>
      <p>HỖ TRỢ FW 5.05 - 13.52</p>
    </div>

    <div class="info-card">
      <div class="info-label">FIRMWARE</div>
      <div class="info-value" id="fw-val">Đang kiểm tra...</div>
    </div>

    <div class="info-card">
      <div class="info-label">TẢI TRỌNG</div>
      <div class="info-value">GoldHEN v2.4b18.12</div>
    </div>

    <div class="info-card">
      <div class="info-label">NGÀY CẬP NHẬT</div>
      <div class="info-value">27/09/2026</div>
    </div>

    <div class="info-card">
      <div class="info-label">TRẠNG THÁI</div>
      <div class="info-value" id="msgs">Đang tải GoldHEN... Vui lòng chờ</div>
    </div>

    <script>
      // Tối ưu bộ nhớ: Giải phóng tài nguyên không cần thiết để tránh Kernel Panic
      if (window.gc) window.gc();

      var uaFull = navigator.userAgent;
      var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
      var isPS4 = match !== null;
      var fwVersion = isPS4 ? match[1] : "Unknown";
      var fwNum = parseFloat(fwVersion);

      var msgs = document.getElementById("msgs");
      var fwVal = document.getElementById("fw-val");

      function onScriptError() {
        msgs.className = "info-value error";
        msgs.innerHTML = "Không tìm thấy nội dung! - Xóa dữ liệu duyệt web và cài lại Cache ...";
      }

      function loadScript(src, isModule, callback) {
        var script = document.createElement('script');
        if (isModule) script.type = 'module';
        script.src = src;
        script.onerror = onScriptError;
        if (callback) script.onload = callback;
        document.head.appendChild(script);
      }

      if (!isPS4) {
        fwVal.className = "info-value error";
        fwVal.innerHTML = "Không phải PS4";
        msgs.className = "info-value error";
        msgs.innerHTML = "Chỉ hỗ trợ máy PS4 FW 5.05 và 7.00 - 13.52";
      } else {
        fwVal.innerHTML = "PS4 " + fwVersion;

        if (window.applicationCache && window.applicationCache.status == 0) {
          if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
          } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
          } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
          } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
          } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
          } else {
            fwVal.className = "info-value error";
            msgs.className = "info-value error";
            msgs.innerHTML = 'Firmware không được hỗ trợ: ' + fwVersion;
          }
        } else {
          if (fwNum == 5.05 || fwNum == 5.07) {
            loadScript("505/exploit.js", false);
          }
          else if (fwNum >= 7.00 && fwNum <= 8.52) {
            loadScript("700/alert.js", true);
          }
          else if (fwNum >= 9.00 && fwNum <= 9.60) {
            loadScript("900/alert.js", true);
          }
          else if (fwNum >= 10.00 && fwNum <= 11.02) {
            loadScript("css/main.js", false, function () {
              setTimeout(function () {
                if (typeof doJb === 'function') doJb();
              }, 500);
            });
          }
          else if (fwNum >= 11.50 && fwNum <= 12.02) {
            loadScript("slopkit/chain_lapse.js", true);
          }
          else if (fwNum >= 12.50 && fwNum <= 13.00) {
            loadScript("slopkit/chain_poops.js", true);
          }
          else if (fwNum >= 13.02 && fwNum <= 13.52) {
            loadScript("slopkit/jb.js?v=19", true);
          } else {
            msgs.className = "info-value error";
            msgs.innerHTML = 'Chỉ hỗ trợ máy PS4 FW 5.05 và 7.00 - 13.52';
          }
        }
      }
    </script>
</body>

</html>
